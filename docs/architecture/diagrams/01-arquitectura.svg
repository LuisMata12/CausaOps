<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-label="Arquitectura de CausaOps: el navegador solo habla con la aplicacion Next.js, que llama a la API FastAPI; la API es el unico componente que accede a PostgreSQL y a Groq.">
  <defs>
    <marker id="a-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6b2"/></marker>
    <marker id="a-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#75a8ff"/></marker>
    <marker id="a-lim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7f34a"/></marker>
  </defs>
  <rect width="1080" height="680" fill="#080b0f"/>
  <g font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="40" y="40" fill="#f3f6f8" font-size="22" font-weight="700">CausaOps &#183; Arquitectura del sistema</text>
    <text x="40" y="64" fill="#9aa6b2" font-size="13">Monolito modular: una API, una base de datos. Las integraciones externas viven detr&#225;s de interfaces estrechas.</text>

    <line x1="258" y1="96" x2="258" y2="600" stroke="#27303b" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="240" y="112" fill="#9aa6b2" font-size="10.5" letter-spacing="1.2" text-anchor="end">NAVEGADOR</text>
    <text x="276" y="112" fill="#9aa6b2" font-size="10.5" letter-spacing="1.2">SERVIDOR &#183; RED PRIVADA</text>

    <g>
      <rect x="40" y="306" width="180" height="76" rx="10" fill="#11161d" stroke="#27303b" stroke-width="1.5"/>
      <text x="130" y="338" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">Navegador</text>
      <text x="130" y="358" fill="#9aa6b2" font-size="11" text-anchor="middle">solo HTML y JSON</text>
    </g>
    <g>
      <rect x="300" y="306" width="180" height="76" rx="10" fill="#11161d" stroke="#27303b" stroke-width="1.5"/>
      <text x="390" y="332" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">Next.js web</text>
      <text x="390" y="351" fill="#9aa6b2" font-size="11" text-anchor="middle">React Server Components</text>
      <text x="390" y="368" fill="#9aa6b2" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">:3000</text>
    </g>
    <g>
      <rect x="560" y="306" width="184" height="76" rx="10" fill="#11161d" stroke="#b7f34a" stroke-width="1.8"/>
      <text x="652" y="332" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">FastAPI</text>
      <text x="652" y="351" fill="#9aa6b2" font-size="11" text-anchor="middle">ingesta &#183; incidentes &#183; diagn&#243;stico</text>
      <text x="652" y="368" fill="#9aa6b2" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">:8000</text>
    </g>
    <g>
      <rect x="840" y="306" width="180" height="76" rx="10" fill="#11161d" stroke="#27303b" stroke-width="1.5"/>
      <text x="930" y="332" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">PostgreSQL</text>
      <text x="930" y="351" fill="#9aa6b2" font-size="11" text-anchor="middle">sistema de registro</text>
      <text x="930" y="368" fill="#9aa6b2" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">:5432</text>
    </g>
    <g>
      <rect x="300" y="126" width="180" height="76" rx="10" fill="#11161d" stroke="#27303b" stroke-width="1.5"/>
      <text x="390" y="152" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">Demo Payments</text>
      <text x="390" y="171" fill="#9aa6b2" font-size="11" text-anchor="middle">modos stable / timeout</text>
      <text x="390" y="188" fill="#9aa6b2" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">:8100</text>
    </g>
    <g>
      <rect x="840" y="126" width="180" height="76" rx="10" fill="#11161d" stroke="#75a8ff" stroke-width="1.8" stroke-dasharray="6 4"/>
      <text x="930" y="152" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">Groq</text>
      <text x="930" y="171" fill="#75a8ff" font-size="11" text-anchor="middle">gpt-oss-120b / 20b</text>
      <text x="930" y="188" fill="#9aa6b2" font-size="10.5" text-anchor="middle">sin estado, sin herramientas</text>
    </g>
    <g>
      <rect x="840" y="486" width="180" height="76" rx="10" fill="#11161d" stroke="#b7f34a" stroke-width="1.8"/>
      <text x="930" y="512" fill="#f3f6f8" font-size="14.5" font-weight="700" text-anchor="middle">Detector</text>
      <text x="930" y="531" fill="#9aa6b2" font-size="11" text-anchor="middle">proceso aparte, sin cola</text>
      <text x="930" y="548" fill="#9aa6b2" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">app.detect --loop</text>
    </g>

    <line x1="224" y1="344" x2="294" y2="344" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#a-mut)"/>
    <text x="259" y="334" fill="#9aa6b2" font-size="10.5" text-anchor="middle">HTTP</text>
    <line x1="484" y1="344" x2="554" y2="344" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#a-mut)"/>
    <text x="519" y="334" fill="#9aa6b2" font-size="10.5" text-anchor="middle">fetch SSR</text>
    <line x1="748" y1="344" x2="834" y2="344" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#a-mut)"/>
    <text x="791" y="334" fill="#9aa6b2" font-size="10.5" text-anchor="middle">lee / escribe</text>

    <polyline points="390,206 390,256 600,256 600,300" fill="none" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#a-mut)"/>
    <text x="500" y="248" fill="#9aa6b2" font-size="10.5" text-anchor="middle">POST telemetr&#237;a &#183; deploys  (best-effort)</text>

    <polyline points="700,302 700,150 834,150" fill="none" stroke="#75a8ff" stroke-width="1.6" marker-end="url(#a-blu)"/>
    <text x="690" y="228" fill="#75a8ff" font-size="10.5" text-anchor="end">snapshot curado</text>
    <polyline points="840,178 724,178 724,300" fill="none" stroke="#75a8ff" stroke-width="1.6" marker-end="url(#a-blu)"/>
    <text x="736" y="252" fill="#75a8ff" font-size="10.5">JSON validado</text>

    <line x1="930" y1="482" x2="930" y2="388" stroke="#b7f34a" stroke-width="1.6" marker-end="url(#a-lim)"/>
    <text x="918" y="432" fill="#b7f34a" font-size="10.5" text-anchor="end">cada 30 s</text>
    <text x="918" y="448" fill="#9aa6b2" font-size="10.5" text-anchor="end">abre y cierra incidentes</text>

    <g font-size="11">
      <rect x="40" y="624" width="14" height="3" rx="1.5" fill="#b7f34a"/>
      <text x="62" y="630" fill="#9aa6b2">hechos deterministas</text>
      <rect x="230" y="624" width="14" height="3" rx="1.5" fill="#75a8ff"/>
      <text x="252" y="630" fill="#9aa6b2">inferencia IA</text>
      <rect x="390" y="624" width="14" height="3" rx="1.5" fill="#75a8ff" opacity="0.5"/>
      <text x="412" y="630" fill="#9aa6b2">borde discontinuo = servicio externo</text>
      <text x="1040" y="630" fill="#9aa6b2" text-anchor="end">El navegador nunca habla con PostgreSQL ni con el LLM.</text>
    </g>
  </g>
</svg>
