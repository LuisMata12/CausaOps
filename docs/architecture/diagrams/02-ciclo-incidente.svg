<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 620" width="1420" height="620" role="img" aria-label="Ciclo de vida de un incidente en CausaOps: telemetria, hechos persistidos, reglas deterministas, incidente con evidencia, diagnostico Groq, aprobacion humana y rollback simulado pendientes de la fase 5, y verificacion de recuperacion que realimenta al detector.">
  <defs>
    <marker id="b-mut" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa6b2"/></marker>
    <marker id="b-lim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b7f34a"/></marker>
  </defs>
  <rect width="1420" height="620" fill="#080b0f"/>
  <g font-family="ui-sans-serif,-apple-system,'Helvetica Neue',Arial,sans-serif">
    <text x="60" y="38" fill="#f3f6f8" font-size="22" font-weight="700">Ciclo de vida de un incidente</text>
    <text x="60" y="62" fill="#9aa6b2" font-size="13">Los hechos deterministas y la inferencia de IA son etapas separadas. La IA nunca escribe estado del incidente.</text>

    <polyline points="1360,396 1392,396 1392,88 880,88 880,118" fill="none" stroke="#b7f34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#b-lim)"/>
    <text x="1130" y="80" fill="#b7f34a" font-size="11" text-anchor="middle">el detector reeval&#250;a la ventana cada 30 s</text>

    <g>
      <rect x="60" y="124" width="280" height="112" rx="12" fill="#11161d" stroke="#b7f34a" stroke-width="1.6"/>
      <text x="80" y="152" fill="#b7f34a" font-size="10" letter-spacing="1.2">01 &#183; INGESTA</text>
      <text x="80" y="176" fill="#f3f6f8" font-size="15.5" font-weight="700">Telemetr&#237;a</text>
      <text x="80" y="198" fill="#9aa6b2" font-size="11">Eventos, m&#233;tricas y deploys versionados</text>
      <text x="80" y="215" fill="#9aa6b2" font-size="11">llegan del servicio demo.</text>
    </g>
    <g>
      <rect x="400" y="124" width="280" height="112" rx="12" fill="#11161d" stroke="#b7f34a" stroke-width="1.6"/>
      <text x="420" y="152" fill="#b7f34a" font-size="10" letter-spacing="1.2">02 &#183; PERSISTENCIA</text>
      <text x="420" y="176" fill="#f3f6f8" font-size="15.5" font-weight="700">Hechos crudos</text>
      <text x="420" y="198" fill="#9aa6b2" font-size="11">La API valida y guarda el hecho</text>
      <text x="420" y="215" fill="#9aa6b2" font-size="11">antes de aplicar ninguna regla.</text>
    </g>
    <g>
      <rect x="740" y="124" width="280" height="112" rx="12" fill="#11161d" stroke="#b7f34a" stroke-width="1.6"/>
      <text x="760" y="152" fill="#b7f34a" font-size="10" letter-spacing="1.2">03 &#183; REGLAS</text>
      <text x="760" y="176" fill="#f3f6f8" font-size="15.5" font-weight="700">Detecci&#243;n determinista</text>
      <text x="760" y="198" fill="#9aa6b2" font-size="11">error &gt; 10 % &#183; p95 &gt; 2000 ms &#183; 3 health fails</text>
      <text x="760" y="215" fill="#9aa6b2" font-size="11">en una ventana m&#243;vil de 5 min.</text>
    </g>
    <g>
      <rect x="1080" y="124" width="280" height="112" rx="12" fill="#11161d" stroke="#b7f34a" stroke-width="1.6"/>
      <text x="1100" y="152" fill="#b7f34a" font-size="10" letter-spacing="1.2">04 &#183; CORRELACI&#211;N</text>
      <text x="1100" y="176" fill="#f3f6f8" font-size="15.5" font-weight="700">Incidente + evidencia</text>
      <text x="1100" y="198" fill="#9aa6b2" font-size="11">Uno abierto por servicio. El deploy reciente</text>
      <text x="1100" y="215" fill="#9aa6b2" font-size="11">sube la severidad, no explica la causa.</text>
    </g>

    <line x1="344" y1="180" x2="394" y2="180" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>
    <line x1="684" y1="180" x2="734" y2="180" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>
    <line x1="1024" y1="180" x2="1074" y2="180" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>
    <polyline points="1220,240 1220,286 200,286 200,334" fill="none" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>

    <g>
      <rect x="60" y="340" width="280" height="112" rx="12" fill="#11161d" stroke="#75a8ff" stroke-width="1.6"/>
      <text x="80" y="368" fill="#75a8ff" font-size="10" letter-spacing="1.2">05 &#183; INFERENCIA</text>
      <text x="80" y="392" fill="#f3f6f8" font-size="15.5" font-weight="700">Diagn&#243;stico Groq</text>
      <text x="80" y="414" fill="#9aa6b2" font-size="11">Snapshot curado, schema estricto y</text>
      <text x="80" y="431" fill="#9aa6b2" font-size="11">cada cita verificada por el backend.</text>
    </g>
    <g>
      <rect x="400" y="340" width="280" height="112" rx="12" fill="#11161d" stroke="#27303b" stroke-width="1.6" stroke-dasharray="6 4"/>
      <rect x="592" y="352" width="72" height="18" rx="9" fill="#27303b"/>
      <text x="628" y="365" fill="#9aa6b2" font-size="9.5" letter-spacing="0.8" text-anchor="middle">FASE 5</text>
      <text x="420" y="368" fill="#9aa6b2" font-size="10" letter-spacing="1.2">06 &#183; CONTROL</text>
      <text x="420" y="392" fill="#9aa6b2" font-size="15.5" font-weight="700">Aprobaci&#243;n humana</text>
      <text x="420" y="414" fill="#9aa6b2" font-size="11">Una acci&#243;n de allow-list, nunca</text>
      <text x="420" y="431" fill="#9aa6b2" font-size="11">comandos ni URLs arbitrarias.</text>
    </g>
    <g>
      <rect x="740" y="340" width="280" height="112" rx="12" fill="#11161d" stroke="#27303b" stroke-width="1.6" stroke-dasharray="6 4"/>
      <rect x="932" y="352" width="72" height="18" rx="9" fill="#27303b"/>
      <text x="968" y="365" fill="#9aa6b2" font-size="9.5" letter-spacing="0.8" text-anchor="middle">FASE 5</text>
      <text x="760" y="368" fill="#9aa6b2" font-size="10" letter-spacing="1.2">07 &#183; ACCI&#211;N</text>
      <text x="760" y="392" fill="#9aa6b2" font-size="15.5" font-weight="700">Rollback simulado</text>
      <text x="760" y="414" fill="#9aa6b2" font-size="11">Ejecutor detr&#225;s de una interfaz</text>
      <text x="760" y="431" fill="#9aa6b2" font-size="11">estrecha, igual que el proveedor LLM.</text>
    </g>
    <g>
      <rect x="1080" y="340" width="280" height="112" rx="12" fill="#11161d" stroke="#b7f34a" stroke-width="1.6"/>
      <text x="1100" y="368" fill="#b7f34a" font-size="10" letter-spacing="1.2">08 &#183; CIERRE</text>
      <text x="1100" y="392" fill="#f3f6f8" font-size="15.5" font-weight="700">Recuperaci&#243;n verificada</text>
      <text x="1100" y="414" fill="#9aa6b2" font-size="11">Exige muestras nuevas y sanas.</text>
      <text x="1100" y="431" fill="#b7f34a" font-size="11">El silencio no es recuperaci&#243;n.</text>
    </g>

    <line x1="344" y1="396" x2="394" y2="396" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>
    <line x1="684" y1="396" x2="734" y2="396" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>
    <line x1="1024" y1="396" x2="1074" y2="396" stroke="#9aa6b2" stroke-width="1.6" marker-end="url(#b-mut)"/>

    <g font-size="11">
      <rect x="60" y="528" width="14" height="3" rx="1.5" fill="#b7f34a"/>
      <text x="82" y="534" fill="#9aa6b2">etapa determinista &#183; implementada</text>
      <rect x="330" y="528" width="14" height="3" rx="1.5" fill="#75a8ff"/>
      <text x="352" y="534" fill="#9aa6b2">etapa de IA &#183; implementada</text>
      <rect x="570" y="528" width="14" height="3" rx="1.5" fill="#27303b"/>
      <text x="592" y="534" fill="#9aa6b2">pendiente &#183; fase 5</text>
      <text x="1360" y="534" fill="#9aa6b2" text-anchor="end">Las etapas 01-05 y 08 funcionan hoy. El bucle se cierra con la fase 5.</text>
    </g>
  </g>
</svg>
